<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark" />
    <meta name="theme-color" content="#08111F" />
    <meta name="robots" content="noindex" />
    <title>Page Not Found — Ahmed Aziz Ben Aissa</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <style>
      :root {
        color-scheme: dark;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont,
          "Segoe UI", sans-serif;
        background: #08111f;
        color: #f5f7fa;
      }

      * {
        box-sizing: border-box;
      }

      body {
        min-width: 0;
        min-height: 100vh;
        margin: 0;
        background: #08111f;
        color: #f5f7fa;
      }

      a {
        color: #7dd3fc;
      }

      a:focus-visible {
        outline: 3px solid #fde047;
        outline-offset: 3px;
      }

      .site-header {
        width: min(100% - 2rem, 72rem);
        margin-inline: auto;
        padding-block: 1.25rem;
        border-bottom: 1px solid #2b3b52;
      }

      .brand {
        display: inline-flex;
        min-height: 44px;
        flex-direction: column;
        justify-content: center;
        color: #f5f7fa;
        font-weight: 700;
        line-height: 1.25;
        text-decoration: none;
      }

      .role {
        color: #b7c3d4;
        font-size: 0.875rem;
        font-weight: 500;
      }

      .error-page {
        display: grid;
        width: min(100% - 2rem, 46rem);
        min-height: calc(100vh - 6rem);
        margin-inline: auto;
        align-content: center;
        padding-block: 3rem;
      }

      .error-code {
        margin: 0 0 0.75rem;
        color: #5eead4;
        font-family: ui-monospace, SFMono-Regular, Consolas, "Liberation Mono", monospace;
        font-weight: 700;
        letter-spacing: 0.12em;
      }

      h1 {
        margin: 0;
        font-size: clamp(2.25rem, 8vw, 4.5rem);
        line-height: 1.05;
      }

      h1 + p {
        max-width: 38rem;
        margin: 1.25rem 0 0;
        color: #b7c3d4;
        font-size: clamp(1rem, 0.96rem + 0.2vw, 1.125rem);
        line-height: 1.65;
      }

      nav {
        display: flex;
        flex-wrap: wrap;
        gap: 0.75rem;
        margin-top: 2rem;
      }

      nav a {
        display: inline-flex;
        min-height: 44px;
        align-items: center;
        justify-content: center;
        padding: 0.7rem 1rem;
        border: 1px solid #5b7393;
        border-radius: 0.75rem;
        font-weight: 700;
        text-decoration: none;
      }

      .primary-link {
        border-color: #5eead4;
        background: #5eead4;
        color: #062821;
      }

      .secondary-link {
        background: #101b2d;
        color: #f5f7fa;
      }

      @media (max-width: 30rem) {
        nav {
          align-items: stretch;
          flex-direction: column;
        }

        nav a {
          width: 100%;
        }
      }
    </style>
  </head>
  <body>
    <header class="site-header">
      <a class="brand" href="/">
        <span>Ahmed Aziz Ben Aissa</span>
        <span class="role">AI Systems Engineer</span>
      </a>
    </header>
    <main id="main" class="error-page">
      <p class="error-code">404</p>
      <h1>Page not found</h1>
      <p>The page you requested does not exist or may have moved.</p>
      <nav aria-label="Error page">
        <a class="primary-link" href="/">Return home</a>
        <a class="secondary-link" href="/projects/">View projects</a>
      </nav>
    </main>
  </body>
</html>
