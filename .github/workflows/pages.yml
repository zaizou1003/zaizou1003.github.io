name: Verify and prepare GitHub Pages

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

defaults:
  run:
    shell: bash

concurrency:
  group: pages-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out the event revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1
          lfs: false
          submodules: false
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Record approved runtime metadata
        run: |
          node --version
          npm --version
          printf 'Runner: %s; image: %s %s\n' "$RUNNER_OS" "$ImageOS" "$ImageVersion"
      - name: Discover hosted Google Chrome
        run: |
          set -euo pipefail
          browser_path="$(command -v google-chrome)"
          test -x "$browser_path"
          printf 'Chrome executable: %s\n' "$browser_path"
          "$browser_path" --version
          printf 'BROWSER_PATH=%s\n' "$browser_path" >> "$GITHUB_ENV"
      - name: Install locked dependencies without lifecycle scripts
        timeout-minutes: 5
        run: npm ci --ignore-scripts
      - name: Verify dependency manifests are unchanged
        run: git diff --exit-code -- package.json package-lock.json
      - name: Verify the Linux Oxlint executable
        run: ./node_modules/.bin/oxlint --version
      - name: Run the complete quality suite
        timeout-minutes: 20
        run: npm run quality
      - name: Reconfirm trusted output and immutable manifests
        run: |
          npm run verify:dist
          test -z "$(git ls-files -- dist)"
          git diff --exit-code -- package.json package-lock.json

  prepare_pages:
    needs: verify
    if: >-
      github.event_name == 'pull_request' ||
      (github.event_name == 'push' && github.ref == 'refs/heads/main' && github.repository == 'zaizou1003/zaizou1003.github.io')
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Check out the event revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1
          lfs: false
          submodules: false
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Record approved runtime metadata
        run: |
          node --version
          npm --version
          printf 'Runner: %s; image: %s %s\n' "$RUNNER_OS" "$ImageOS" "$ImageVersion"
      - name: Install locked dependencies without lifecycle scripts
        run: npm ci --ignore-scripts
      - name: Verify dependency manifests are unchanged
        run: git diff --exit-code -- package.json package-lock.json
      - name: Verify the Linux Oxlint executable
        run: ./node_modules/.bin/oxlint --version
      - name: Build the production distribution
        run: npm run build
      - name: Verify the distribution immediately before packaging
        run: npm run verify:dist
      - name: Reconfirm trusted output and immutable manifests
        run: |
          test -z "$(git ls-files -- dist)"
          git diff --exit-code -- package.json package-lock.json
      - name: Prepare pull-request Pages artifact
        if: github.event_name == 'pull_request'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          name: github-pages
          path: dist
          retention-days: 7
          include-hidden-files: false
      - name: Prepare canonical-main Pages artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && github.repository == 'zaizou1003/zaizou1003.github.io'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          name: github-pages
          path: dist
          retention-days: 1
          include-hidden-files: false

  deploy:
    needs: prepare_pages
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && github.repository == 'zaizou1003/zaizou1003.github.io'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: pages-production
      cancel-in-progress: false
    steps:
      - name: Deploy verified Pages artifact
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
        with:
          artifact_name: github-pages
